name: CI Pipeline (Full Dockerized)

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Install frontend deps
        run: cd frontend; npm install

      - name: Lint frontend
        run: cd frontend; npx lint-staged

      - name: Install backend deps
        run: cd backend; npm install

      - name: Lint backend
        run: cd backend; npx lint-staged

  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - uses: actions/checkout@v3

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install backend deps
        run: cd backend; npm install

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Install backend deps
        run: cd backend; npm install

      - name: Run backend tests
        run: cd backend; npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  sonarcloud:
    name: SonarCloud Scan
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v3

      - name: Install sonar-scanner
        run: |
          $version = "6.2.1.4610"
          $url = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$version-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\sonar-scanner.zip"
          Expand-Archive -Path "$env:TEMP\sonar-scanner.zip" -DestinationPath "$env:TEMP\sonar-scanner" -Force
          echo "$env:TEMP\sonar-scanner\sonar-scanner-$version-windows-x64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Run SonarCloud Scan
        run: |
          $params = @(
            "-Dsonar.projectKey=mathyscxsl_CloudNativeApplicationCurse",
            "-Dsonar.organization=mathyscxsl",
            "-Dsonar.host.url=https://sonarcloud.io",
            "-Dsonar.login=${{ secrets.SONAR_TOKEN }}",
            "-Dsonar.sources=backend/src",
            "-Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info",
            "-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}",
            "-Dsonar.pullrequest.branch=${{ github.head_ref }}",
            "-Dsonar.pullrequest.base=${{ github.base_ref }}"
          )
          & sonar-scanner @params

  docker:
    name: Build & Push Docker Images
    runs-on: self-hosted
    needs: sonarcloud
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t backend-ci ./backend

      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Tag & Push backend
        run: |
          docker tag backend-ci ${{ secrets.DOCKER_USERNAME }}/cloudnative-backend:${{ github.sha }}
          docker tag backend-ci ${{ secrets.DOCKER_USERNAME }}/cloudnative-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudnative-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudnative-backend:latest

      - name: Tag & Push frontend
        run: |
          docker tag frontend-ci ${{ secrets.DOCKER_USERNAME }}/cloudnative-frontend:${{ github.sha }}
          docker tag frontend-ci ${{ secrets.DOCKER_USERNAME }}/cloudnative-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudnative-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudnative-frontend:latest

  deploy:
    name: Deploy to local environment
    runs-on: self-hosted
    needs: docker
    steps:
      - uses: actions/checkout@v3

      - name: Run deploy script
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: pwsh -File ./scripts/deploy.ps1

      - name: Verify containers are running
        run: docker compose ps
