global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nest-backend-blue"
    static_configs:
      - targets: ["app-back-blue:3000"]
    metrics_path: "/metrics"

  - job_name: "nest-backend-green"
    static_configs:
      - targets: ["app-back-green:3000"]
    metrics_path: "/metrics"
